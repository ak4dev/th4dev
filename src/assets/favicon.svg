<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="th4dev">
  <title>th4dev</title>
  <!--
    The app in one mark: a plan climbing toward the target it has to reach,
    inside the band of outcomes around it. The band is drawn as a soft halo
    tracking the same curve rather than a translucent wedge — at 16px a
    wedge reads as a smudge, a halo reads as a band. Nothing here is thinner
    than 2px on the 32px grid, so the whole mark survives being shown small.
  -->
  <rect width="32" height="32" rx="7" fill="#282a36" />

  <!-- The band of outcomes around the projection -->
  <path
    d="M7 23.5C13.2 22.4 18.6 18 25 9.2"
    fill="none"
    stroke="#8be9fd"
    stroke-width="10"
    stroke-linecap="round"
    opacity=".16"
  />

  <!-- The plan itself -->
  <path
    d="M7 23.5C13.2 22.4 18.6 18 25 9.2"
    fill="none"
    stroke="#50fa7b"
    stroke-width="3.4"
    stroke-linecap="round"
  />

  <!-- The target it has to land on -->
  <circle cx="25" cy="9.2" r="3.6" fill="#8be9fd" />
</svg>
